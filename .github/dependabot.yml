# Grouping note: inside a group, the key for semver levels is `update-types`.
# `dependency-types` is a different key that only accepts "development" and
# "production", so using it for minor/patch makes Dependabot reject this file.
#
# This repository has no Node layer, so there is no npm ecosystem here.
#
# Caution: a dependency bound in `pyproject.toml` states the oldest API that
# the code uses. It must stay below the version that Pyodide ships, because
# micropip refuses to reinstall a package that Pyodide already ships. Read
# AGENTS.md section 8 before you merge a bump of a runtime bound.
version: 2
updates:
  - package-ecosystem: uv # reads pyproject.toml and uv.lock
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns:
          - '*'
