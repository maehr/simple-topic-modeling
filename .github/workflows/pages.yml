name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Declared per job. The build job needs no deploy credentials.
permissions:
  contents: read

# Never cancel a running deploy. A cancelled deploy can leave the site
# half-published, so queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # marimo's own wheel builder copies .py files only. It drops the
      # stop-word lists and the demo corpus. hatchling ships them, so the
      # export must find this wheel. `app.py` names it in its PEP 723 block.
      - name: Build the package wheel
        run: uv build --wheel -o public/wheels

      - name: Export the app
        run: uv run marimo export html-wasm app.py -o dist --mode run

      # The wheel file name carries the version. A stale name passes every
      # test and then fails in the browser with ModuleNotFoundError.
      - name: Check the published files
        run: |
          version=$(uv version --short)
          for f in index.html "public/wheels/browser_topics-${version}-py3-none-any.whl"; do
            if [ ! -f "dist/$f" ]; then
              echo "MISSING from the site: $f"
              exit 1
            fi
          done
          echo "Every file that the app needs is present."

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
