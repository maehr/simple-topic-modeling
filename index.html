<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<title>Simple Topic Modeling</title>
		<meta name="description" content="A simple topic modeling application." />
		<link rel="canonical" href="https://maehr.github.io/simple-topic-modeling/" />
		<link href="assets/stlite/build/stlite.css" rel="stylesheet" />
		<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
		<link rel="manifest" href="site.webmanifest" />
	</head>

	<body>
		<main id="main"></main>
		<noscript>
			<p>This application needs JavaScript. It runs Python in your browser with WebAssembly.</p>
		</noscript>
		<script type="module">
			import { mount } from './assets/stlite/build/stlite.js';

			// Resolve every asset against the page itself. stlite runs Python in a web worker,
			// where a bare relative URL does not resolve against the page. An absolute URL to
			// one deployment would break forks and local runs, so build it at load time.
			const base = new URL('.', window.location.href).href;

			mount(
				{
					requirements: [
						'pandas',
						'scikit-learn',
						new URL('assets/dist/pyLDAvis-3.4.1-py3-none-any.whl', base).href
					],
					entrypoint: 'app.py',
					files: {
						'app.py': { url: new URL('src/app.py', base).href },
						'topic_model.py': { url: new URL('src/topic_model.py', base).href },
						'utils/stopwords.py': { url: new URL('src/utils/stopwords.py', base).href }
					},
					streamlitConfig: {
						'client.toolbarMode': 'viewer'
					}
				},
				document.getElementById('main')
			);
		</script>
	</body>
</html>
