[project]
name = "simple-topic-modeling"
version = "0.1.0"
description = "This app is a simple topic modeling tool that uses Latent Dirichlet Allocation (LDA) to discover topics in a corpus of text documents."
authors = [{ name = "Moritz Mähr", email = "moritz.maehr@gmail.com" }]
license = "AGPL-3.0"
readme = "README.md"
keywords = ["topic modeling", "lda", "streamlit"]
requires-python = ">=3.11,<3.15"
# The streamlit/pandas/scikit-learn floors below track the Pyodide runtime that
# @stlite/browser bundles for this app (this repo ships the same src/ to a local
# Poetry env and to that in-browser runtime). scripts/stlite.lock.json records the
# exact bundled versions; bump these floors there first.
dependencies = [
    # What this app imports directly.
    "streamlit>=1.62,<2",
    "pandas>=2.1,<3",
    "scikit-learn>=1.7,<2",
    "pyldavis>=3.4.1",

    # pyLDAvis 3.4.1 fails with numpy 2.3 and later. Its NumPyEncoder cannot
    # serialize the complex128 eigenvectors that the newer numpy returns from
    # the PCoA step, so the app dies with "Object of type complex128 is not
    # JSON serializable". Remove this ceiling only after pyLDAvis fixes it.
    # 2.2.5 is also what the browser runtime ships, so both runtimes agree.
    "numpy>=2.2,<2.3",

    # Not imported here. These are transitive dependencies of pyLDAvis and
    # streamlit, floored only to keep the resolver on versions that publish
    # wheels. Without a floor it selects old sdist-only releases that cannot
    # compile against current CPython. Raise them freely; do not treat them
    # as part of this project's public interface.
    "scipy>=1.14",
    "gensim>=4.4.0",
    "numexpr>=2.10",
    "pillow>=11",
    "pyarrow>=18",
]

[project.urls]
Homepage = "https://maehr.github.io/simple-topic-modeling"
Repository = "https://github.com/maehr/simple-topic-modeling"
"Bug Tracker" = "https://github.com/maehr/simple-topic-modeling/issues"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16,<0.17"
pytest = "^8.0.0"
pytest-cov = "^5.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
