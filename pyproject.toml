[project]
name = "browser-topics"
version = "2.0.0"
description = "Browser Topic Explorer: privacy-friendly topic modelling that runs in the browser."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
authors = [{ name = "Moritz Mähr" }]
# These bounds state the oldest API the package actually uses. They must stay low enough for the
# Pyodide build that marimo pins, because micropip refuses to reinstall a package that Pyodide
# already ships. `marimo` is not listed: the package never imports it, only `app.py` does.
dependencies = [
    "altair>=5.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10.0",
    "pydantic>=2.7",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "wordcloud>=1.9",
]

[project.urls]
Homepage = "https://maehr.github.io/simple-topic-modeling"
Repository = "https://github.com/maehr/simple-topic-modeling"
"Bug Tracker" = "https://github.com/maehr/simple-topic-modeling/issues"

[dependency-groups]
dev = [
    "marimo>=0.24.2",
    "prek>=0.5.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "ty==0.0.82",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browser_topics"]

[tool.ruff]
line-length = 100
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "D", "ANN"]
ignore = ["D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
# marimo passes each cell its references as arguments, so a cell argument carries the
# name of the imported symbol. N803 and I001 cannot apply to a generated notebook.
"app.py" = ["D", "ANN", "B018", "N803", "I001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["browser_topics", "tests"]

# Altair builds `mark_*` methods dynamically, so ty cannot infer that they return a Chart.
# The rule stays on everywhere else.
[[tool.ty.overrides]]
include = ["browser_topics/plots.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[tool.pytest.ini_options]
testpaths = ["browser_topics", "tests"]
addopts = "--strict-markers"
doctest_optionflags = ["ELLIPSIS", "IGNORE_EXCEPTION_DETAIL", "NORMALIZE_WHITESPACE"]

[tool.coverage.run]
source = ["browser_topics"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
