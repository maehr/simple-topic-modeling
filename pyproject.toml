[project]
name = "simple-topic-modeling"
version = "0.1.0"
description = "This app is a simple topic modeling tool that uses Latent Dirichlet Allocation (LDA) to discover topics in a corpus of text documents."
authors = [{ name = "Moritz Mähr", email = "moritz.maehr@gmail.com" }]
license = "AGPL-3.0-only"
readme = "README.md"
keywords = ["topic modeling", "lda", "streamlit"]

# One Python version, not a range. The browser runtime that @stlite/browser
# bundles is CPython 3.13, and this repository ships the same src/ to both. A
# range also made the resolver pick old sdist-only releases for 3.14.
requires-python = "==3.13.*"

dependencies = [
    "streamlit>=1.62,<2",
    "pandas>=2.1,<3",
    "scikit-learn>=1.7,<2",
    "pyldavis>=3.4.1",
    # pyLDAvis 3.4.1 fails with numpy 2.3 and later. Its NumPyEncoder cannot
    # serialize the complex128 values that the newer numpy returns from the
    # PCoA step. The app then dies with "Object of type complex128 is not JSON
    # serializable". Remove this ceiling only after pyLDAvis fixes it.
    "numpy>=2.2,<2.3",
]

[project.urls]
Homepage = "https://maehr.github.io/simple-topic-modeling"
Repository = "https://github.com/maehr/simple-topic-modeling"
"Bug Tracker" = "https://github.com/maehr/simple-topic-modeling/issues"

[dependency-groups]
dev = ["ruff>=0.16,<0.17", "pytest>=9,<10", "pytest-cov>=7,<8"]

# No [build-system]. This is an application, not a library, so uv does not
# build or install the project itself.

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
